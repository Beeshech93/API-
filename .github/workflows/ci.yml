name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "chore/**", "fix/**", "feat/**"]

permissions:
  contents: read

jobs:
  verify:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://haitipay:haitipay@localhost:5432/haitipay_test?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests-123456
      CREDENTIALS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: haitipay
          POSTGRES_PASSWORD: haitipay
          POSTGRES_DB: haitipay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haitipay -d haitipay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate --workspace @haitipay/api
      - name: Build all workspaces
        run: npm run build
      - name: Run API unit tests
        run: npm test
