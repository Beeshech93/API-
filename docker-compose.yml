services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: haitipay
      POSTGRES_PASSWORD: haitipay
      POSTGRES_DB: haitipay
    ports:
      - "5432:5432"
    volumes:
      - haitipay_pgdata:/var/lib/postgresql/data

volumes:
  haitipay_pgdata:
