services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayitipay
      POSTGRES_PASSWORD: ayitipay
      POSTGRES_DB: ayitipay
    ports:
      - "5432:5432"
    volumes:
      - ayitipay_pgdata:/var/lib/postgresql/data

volumes:
  ayitipay_pgdata:
